name: Lint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linter
        run: python -m pip install flake8==7.3.0
      - name: Run Linter
        run: flake8 server scripts --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Linter
        run: >-
          npx --yes eslint@8.57.1 server/database server/frontend/src
          --ext .js,.jsx --no-eslintrc --env node,browser,es2022
          --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}'
          --rule 'no-undef:error' --rule 'no-dupe-args:error'
          --rule 'no-dupe-keys:error' --rule 'valid-typeof:error'
