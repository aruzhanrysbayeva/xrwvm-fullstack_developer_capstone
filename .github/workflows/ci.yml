name: Build and test dealership portal
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/frontend/package-lock.json
            server/database/package-lock.json
      - name: Install Python dependencies
        run: pip install -r server/requirements.txt
      - name: Build React frontend
        working-directory: server/frontend
        run: npm ci && npm run build
      - name: Check Django and run portal tests
        working-directory: server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test djangoapp --verbosity 2
      - name: Test sentiment analysis
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('sentiment', 'server/djangoapp/microservices/app.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.app.test_client().get('/analyze/Fantastic%20services').json['sentiment']=='positive'"
      - name: Test Node API against isolated MongoDB
        working-directory: server/database
        run: npm ci && npm test
  containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Django and React container
        run: docker build -t bestcars-web .
      - name: Build dealer service container
        run: docker build -t bestcars-dealers server/database
      - name: Build sentiment container
        run: docker build -t bestcars-sentiment server/djangoapp/microservices
